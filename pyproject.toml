[project]
name = "auction-voice-bid"
version = "0.1.0"
description = "Voice-based auction bid recognition and NLP processing engine"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "numpy",
    "scipy",
    "soundfile",
    "torch",
    "transformers",
    "pytest",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["asr*", "web*", "auction_engine*"]
